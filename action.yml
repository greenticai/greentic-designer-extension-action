name: 'Greentic Designer Extension Publish'
description: 'Build + publish a Greentic Designer Extension (.gtxpack) via the gtdx CLI'
author: 'greenticai'
branding:
  icon: 'package'
  color: 'green'

inputs:
  registry:
    description: |
      Target registry URI. Usually not needed when `store-url` is set.
      Accepts:
        * oci://<host>/<namespace>[/<artifact-name>]  (GHCR, Docker Hub, ACR, Harbor)
        * file://<absolute-path>                       (local filesystem)
        * local                                        (= $GREENTIC_HOME/registries/local)
        * <name>                                       (named entry from ~/.greentic/config.toml)
      When `store-url` + `store-token` are supplied and `registry` is empty,
      the action defaults to `greentic-store` (auto-wired to store-url).
    required: false
    default: ''

  store-url:
    description: |
      Shorthand for Greentic Store HTTP push. When set, the action writes
      ~/.greentic/config.toml with a registry entry named "greentic-store"
      pointing at this URL, and auto-selects it unless `registry` overrides.
      Example: https://store.greentic.cloud
    required: false
    default: ''

  store-token:
    description: |
      Bearer token for the Store server in `store-url`. Accepts either:
        * a long-lived API token (format `gts_...`) — preferred for CI
        * a short-lived JWT from `/api/v1/auth/login` (expires after 24h)
      When set, the action writes ~/.greentic/credentials.toml mode 0600.
      Pair with `store-url`.
    required: false
    default: ''

  manifest:
    description: 'Path to the project Cargo.toml. Default: ./Cargo.toml'
    required: false
    default: './Cargo.toml'

  version:
    description: 'Override describe.json version — useful for CI tag bumps (e.g. v1.2.3 → 1.2.3).'
    required: false
    default: ''

  force:
    description: 'Overwrite an existing version in the target registry.'
    required: false
    default: 'false'

  dry-run:
    description: 'Validate + build + pack, skip the registry write. Useful for PR checks.'
    required: false
    default: 'false'

  oci-token:
    description: |
      Bearer/PAT for oci:// registries. When unset the action falls back in
      order to: GHCR_TOKEN env, GITHUB_TOKEN env (auto-injected in GHA), OCI_TOKEN
      env, then anonymous. Grant the job `permissions: packages: write` when
      pushing to ghcr.io.
    required: false
    default: ''

  format:
    description: '"human" (default) or "json" output'
    required: false
    default: 'human'

  gtdx-version:
    description: |
      Version constraint for `greentic-extension-sdk-cli` (the `gtdx` binary).
      Stable pins resolve from crates.io (e.g. "1.2" or "=1.2.3"); a `-research`
      pin (e.g. "=1.2.4-research") installs from the SDK git tag, since research
      builds are not published to crates.io. Defaults to the latest crates.io release.
    required: false
    default: ''

  rust-toolchain:
    description: 'Rust toolchain version. Must support edition 2024 (>= 1.95).'
    required: false
    default: '1.95'

  cargo-component-version:
    description: 'cargo-component version to install. Default: latest compatible.'
    required: false
    default: ''

  signing-key-pem:
    description: |
      Ed25519 signing key, PKCS8 PEM — exactly what `gtdx keygen` emits. Pass a
      repository/organization secret, never a literal.

      With a key the action runs `gtdx publish --sign`, so the `describe.json`
      *inside* the produced .gtxpack carries a `signature` object.
      greentic-ext-runtime refuses to load an extension whose describe.json has
      no signature ("signature verification failed: missing signature field"),
      so an unsigned publish reaches the Store and is then rejected at every
      tenant's boot — visible only as a `warn` line. That is why the action
      fails closed when this input is empty (see `allow-unsigned`).

      The key must be the one already pinned for these extension ids: the
      runtime anchors the publisher key per extension id on first load (TOFU),
      and a later publish under a different key is refused as a publisher
      mismatch. Set `expected-public-key` to have the action assert that.
    required: false
    default: ''

  signing-key-id:
    description: |
      Optional label recorded as the signature key id in the registry metadata.
      Restricted to [A-Za-z0-9._-] because it names the on-disk key file.
      When empty the signature is labelled `env`.
    required: false
    default: ''

  expected-public-key:
    description: |
      Base64 ed25519 public key the produced artifact must be signed with. When
      set, the action reads the describe.json back out of the packed .gtxpack
      and fails if the signature is missing or was made by a different key —
      catching both an unsigned publish and a publish under the wrong publisher
      (which the runtime would refuse as a TOFU mismatch).
    required: false
    default: ''

  allow-unsigned:
    description: |
      Escape hatch for publishing without a signature. Defaults to `false`: the
      action refuses to publish unsigned rather than shipping an artifact the
      runtime will reject at load time. Set to `true` only for a registry whose
      consumers do not verify signatures, and expect the artifact to be
      unloadable by greentic-ext-runtime.
    required: false
    default: 'false'

outputs:
  sha256:
    description: 'SHA-256 of the published .gtxpack (from the JSON receipt).'
    value: ${{ steps.publish.outputs.sha256 }}
  registry-url:
    description: 'URL of the published artifact (file://, http(s)://, or OCI manifest URL).'
    value: ${{ steps.publish.outputs.registry-url }}
  ext-id:
    description: 'Extension id that was published.'
    value: ${{ steps.publish.outputs.ext-id }}
  version:
    description: 'Published version.'
    value: ${{ steps.publish.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Rust toolchain
      # Pinned to a commit SHA for supply-chain safety. dtolnay/rust-toolchain
      # uses branch refs (master/stable/<version>) rather than version tags, so
      # this is master @ 2026-03-27. Dependabot keeps the pin moving.
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        targets: wasm32-wasip2

    - name: Resolve install versions
      id: versions
      shell: bash
      env:
        IN_GTDX: ${{ inputs.gtdx-version }}
        IN_CC: ${{ inputs.cargo-component-version }}
      run: |
        set -euo pipefail
        # When a version input is empty we install "latest". A constant cache
        # key would then freeze whatever was latest on the first run and never
        # pick up newer releases until the 7-day cache eviction. Resolve the
        # real latest from crates.io so the key moves when upstream publishes —
        # keeping the documented "latest" promise honest.
        # Anchored match prints only the crate's version line (the trailing
        # "...use --limit..." note has no `= "..."`), so no `head`/SIGPIPE dance.
        latest() {
          cargo search "$1" --limit 1 | sed -nE 's/^[^ ]+ = "([^"]+)".*/\1/p'
        }
        if [ -n "$IN_GTDX" ]; then
          echo "gtdx-key=pin-${IN_GTDX}" >> "$GITHUB_OUTPUT"
        else
          echo "gtdx-key=latest-$(latest greentic-extension-sdk-cli)" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$IN_CC" ]; then
          echo "cc-key=pin-${IN_CC}" >> "$GITHUB_OUTPUT"
        else
          echo "cc-key=latest-$(latest cargo-component)" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache cargo-installed binaries
      id: cache-cargo-bin
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin
        key: gtdx-cargo-bin-${{ runner.os }}-rust${{ inputs.rust-toolchain }}-${{ steps.versions.outputs.gtdx-key }}-${{ steps.versions.outputs.cc-key }}-v3

    - name: Install cargo-component
      if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        # Run installs in a directory free of rust-toolchain.toml — the
        # consumer repo may pin an older Rust (e.g. provider-extensions
        # pins 1.94.0 for its WASM components), but the host-side toolchain
        # we install gtdx + cargo-component with needs to match the action's
        # rust-toolchain input (default 1.95) which is what's compatible
        # with the SDK crates' rust-version field.
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        # Pass inputs via env (not `${{ }}` spliced into the script) so a value
        # carrying shell metacharacters can't break out of the command.
        CC_VERSION: ${{ inputs.cargo-component-version }}
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        if [ -n "$CC_VERSION" ]; then
          cargo install --locked --version "$CC_VERSION" cargo-component
        else
          cargo install --locked cargo-component
        fi

    - name: Install gtdx
      if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        GTDX_VERSION: ${{ inputs.gtdx-version }}
        # See comment in `Install cargo-component` step.
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        # Research-channel SDK releases (e.g. `=1.2.4-research`) are
        # intentionally NOT published to crates.io — the SDK repo only
        # ships GitHub Releases + source tags for in-progress integration
        # builds (see SDK release.yml `if: !contains(github.ref_name,
        # "research")`). Install those from the source git tag instead so
        # consumers can pin pre-release SDKs that carry security
        # hardening (audit C2/H7 etc.) ahead of the next stable cut.
        #
        # Stable channel pins go through crates.io as before. `cargo
        # install --version` rejects bare partial versions like "0.4"
        # ("unexpected end of input while parsing minor version number"),
        # so we auto-prefix `^` for bare partials.
        if [ -n "$GTDX_VERSION" ]; then
          arg="$GTDX_VERSION"
          case "$arg" in
            \^*|=*|\>*|\<*|~*) ;;  # already has a range qualifier
            *) arg="^${arg}" ;;
          esac
          # Strip a leading `=` for git-tag lookups: `=1.2.4-research` →
          # `v1.2.4-research`. Other range qualifiers are crates.io-only
          # and don't make sense against a single tag.
          if [[ "$arg" == *research* ]]; then
            bare="${arg#=}"
            tag="v${bare}"
            echo "==> research channel detected; installing gtdx from git tag '$tag'"
            cargo install --locked --git https://github.com/greenticai/greentic-designer-sdk \
              --tag "$tag" greentic-extension-sdk-cli
          else
            echo "==> cargo install --locked --version '$arg' greentic-extension-sdk-cli"
            cargo install --locked --version "$arg" greentic-extension-sdk-cli
          fi
        else
          cargo install --locked greentic-extension-sdk-cli
        fi

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        gtdx --version
        cargo component --version

    - name: Wire Greentic Store config (if store-url supplied)
      if: inputs.store-url != ''
      shell: bash
      env:
        STORE_URL: ${{ inputs.store-url }}
        STORE_TOKEN: ${{ inputs.store-token }}
      run: |
        set -euo pipefail
        # A bearer token over plaintext http:// traverses the network
        # unencrypted and is interceptable. Warn loudly; prefer https://.
        case "$STORE_URL" in
          http://*)
            if [ -n "$STORE_TOKEN" ]; then
              echo "::warning::store-url uses plaintext http://; the store-token will be sent unencrypted. Use https:// for the Store server."
            fi
            ;;
        esac
        mkdir -p "$HOME/.greentic"
        cat > "$HOME/.greentic/config.toml" <<EOF
        [default]
        registry = "greentic-store"
        trust-policy = "normal"

        [[registries]]
        name = "greentic-store"
        url = "$STORE_URL"
        EOF
        if [ -n "$STORE_TOKEN" ]; then
          umask 077
          cat > "$HOME/.greentic/credentials.toml" <<EOF
        [tokens]
        greentic-store = "$STORE_TOKEN"
        EOF
          chmod 0600 "$HOME/.greentic/credentials.toml"
        else
          echo "::warning::store-url was provided without store-token. Publish will 401 unless the server accepts anonymous writes."
        fi

    - name: Resolve registry input
      id: resolve-registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        STORE_URL: ${{ inputs.store-url }}
      run: |
        set -euo pipefail
        if [ -z "$REGISTRY" ] && [ -n "$STORE_URL" ]; then
          echo "registry=greentic-store" >> "$GITHUB_OUTPUT"
        elif [ -z "$REGISTRY" ]; then
          echo "::error::Either 'registry' or 'store-url' must be set."
          exit 1
        else
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve signing key
      id: signing
      shell: bash
      env:
        SIGNING_KEY_PEM: ${{ inputs.signing-key-pem }}
        SIGNING_KEY_ID: ${{ inputs.signing-key-id }}
        ALLOW_UNSIGNED: ${{ inputs.allow-unsigned }}
      run: |
        set -euo pipefail

        if [ -z "$SIGNING_KEY_PEM" ]; then
          # Fail closed. An unsigned .gtxpack publishes fine and is then refused
          # by greentic-ext-runtime at every consumer's boot ("missing signature
          # field") — a failure that surfaces only as a warn line in their logs,
          # long after the release looked green here. Better to break the
          # release than to ship an extension nobody can load.
          if [ "$ALLOW_UNSIGNED" != "true" ]; then
            echo "::error::no 'signing-key-pem' supplied. greentic-ext-runtime refuses an extension whose describe.json carries no signature, so this publish would produce an artifact that no host can load. Pass the PKCS8 PEM signing key (e.g. secrets.EXT_SIGNING_KEY_PEM), or set allow-unsigned: true to publish unsigned deliberately."
            exit 1
          fi
          echo "::warning::allow-unsigned is set — publishing an UNSIGNED artifact. greentic-ext-runtime will refuse to load it."
          echo "sign=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # gtdx reads the PEM from $GREENTIC_EXT_SIGNING_KEY_PEM when neither
        # --key nor --key-id is given, and labels that signature `env`. A
        # caller-supplied key id is worth carrying into the registry metadata,
        # but --key-id makes gtdx load `<home>/keys/<id>.key` from disk with no
        # env fallback — so materialize the file when (and only when) an id is
        # requested.
        if [ -n "$SIGNING_KEY_ID" ]; then
          if ! printf '%s' "$SIGNING_KEY_ID" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::signing-key-id must match [A-Za-z0-9._-]+ — it names a file on disk."
            exit 1
          fi
          key_dir="${RUNNER_TEMP}/gtdx-signing-keys"
          umask 077
          mkdir -p "$key_dir"
          printf '%s\n' "$SIGNING_KEY_PEM" > "${key_dir}/${SIGNING_KEY_ID}.key"
          chmod 0600 "${key_dir}/${SIGNING_KEY_ID}.key"
          echo "key-path=${key_dir}/${SIGNING_KEY_ID}.key" >> "$GITHUB_OUTPUT"
        fi

        echo "sign=true" >> "$GITHUB_OUTPUT"

    - name: Publish
      id: publish
      shell: bash
      env:
        # All caller-controlled inputs are passed via env (not `${{ }}` spliced
        # into the script) so a value carrying shell metacharacters — e.g. a
        # crafted git ref reaching `version` — cannot break out of the command.
        REGISTRY: ${{ steps.resolve-registry.outputs.registry }}
        MANIFEST: ${{ inputs.manifest }}
        FORMAT: ${{ inputs.format }}
        VERSION: ${{ inputs.version }}
        FORCE: ${{ inputs.force }}
        DRY_RUN: ${{ inputs.dry-run }}
        OCI_TOKEN_IN: ${{ inputs.oci-token }}
        SIGN: ${{ steps.signing.outputs.sign }}
        SIGNING_KEY_ID: ${{ inputs.signing-key-id }}
        SIGNING_KEY_PATH: ${{ steps.signing.outputs.key-path }}
        # gtdx's default --key-env. Set unconditionally so `--sign` with no
        # --key/--key-id finds the PEM without it ever reaching a command line.
        GREENTIC_EXT_SIGNING_KEY_PEM: ${{ inputs.signing-key-pem }}
        # gtdx's oci-token lookup chain is:
        #   --oci-token (explicit) -> GHCR_TOKEN -> GITHUB_TOKEN -> OCI_TOKEN -> anonymous.
        # We wire GITHUB_TOKEN automatically so in GitHub Actions `permissions:
        # packages: write` alone is enough. When the caller passes oci-token we
        # *also* forward it as the explicit --oci-token flag below; the flag
        # wins, this env is just the fallback link in the chain.
        GITHUB_TOKEN: ${{ inputs.oci-token != '' && inputs.oci-token || github.token }}
      run: |
        set -euo pipefail

        # Normalize a leading `v` so callers can forward a git tag ref
        # (e.g. a `v1.2.3` tag) straight into `version` and publish `1.2.3`.
        # Only strips `v` when followed by a digit.
        if [[ "$VERSION" =~ ^v[0-9] ]]; then
          VERSION="${VERSION#v}"
        fi

        args=(publish
          --registry "$REGISTRY"
          --manifest "$MANIFEST"
          --format   "$FORMAT"
        )
        if [ -n "$VERSION" ]; then
          args+=(--version "$VERSION")
        fi
        if [ "$FORCE" = "true" ]; then
          args+=(--force)
        fi
        if [ "$DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        if [ -n "$OCI_TOKEN_IN" ]; then
          args+=(--oci-token "$OCI_TOKEN_IN")
        fi
        if [ "$SIGN" = "true" ]; then
          # Signs the describe.json *inside* the pack, not just the registry
          # metadata — that inner signature is what the runtime verifies.
          args+=(--sign)
          if [ -n "$SIGNING_KEY_PATH" ]; then
            args+=(--key "$SIGNING_KEY_PATH" --key-id "$SIGNING_KEY_ID")
          fi
        fi

        # Run gtdx publish and capture stdout for output extraction. Parse from
        # stdout (not the ./dist receipt file): the receipt file carries only
        # sha256/registry, while ext_id + version live solely in gtdx's stdout —
        # which surfaces all four in both --format json and --format human.
        gtdx "${args[@]}" | tee gtdx-publish.stdout

        sha=""; url=""; ext_id=""; ver=""
        if [ "$FORMAT" = "json" ]; then
          # One compact JSON object per publish (event=published|dry_run|verify_only).
          line=$(grep -m1 '"event"' gtdx-publish.stdout || true)
          if [ -n "$line" ]; then
            sha=$(printf '%s' "$line"    | jq -r '.sha256 // empty')
            url=$(printf '%s' "$line"    | jq -r '.registry_url // .registry // empty')
            ext_id=$(printf '%s' "$line" | jq -r '.ext_id // empty')
            ver=$(printf '%s' "$line"    | jq -r '.version // empty')
          fi
        else
          # Human format. Strip ANSI, then read the labelled lines:
          #   ✓ published <ext_id>@<version>
          #     sha256:   <sha>
          #     registry: <registry_url>
          clean=$(sed -E 's/\x1b\[[0-9;]*m//g' gtdx-publish.stdout)
          pub=$(printf '%s\n' "$clean" | grep -m1 'published ' || true)
          if [ -n "$pub" ]; then
            pub="${pub##*published }"   # -> "<ext_id>@<version>"
            ext_id="${pub%@*}"
            ver="${pub##*@}"
          fi
          sha=$(printf '%s\n' "$clean" | sed -nE 's/^[[:space:]]*sha256:[[:space:]]*([0-9a-fA-F]+).*/\1/p' | head -1)
          url=$(printf '%s\n' "$clean" | sed -nE 's/^[[:space:]]*registry:[[:space:]]*(.+[^[:space:]])[[:space:]]*$/\1/p' | head -1)
        fi

        if [ -n "$sha$url$ext_id$ver" ]; then
          {
            echo "sha256=$sha"
            echo "registry-url=$url"
            echo "ext-id=$ext_id"
            echo "version=$ver"
          } >> "$GITHUB_OUTPUT"
        fi

        # Don't silently emit empty outputs: gtdx exited 0 (pipefail would have
        # failed the step otherwise), so an empty sha means stdout parsing — not
        # the publish — failed. Surface it for any real (non-dry-run) publish.
        if [ -z "$sha" ] && [ "$DRY_RUN" != "true" ]; then
          echo "::warning::gtdx publish succeeded but its output could not be parsed; outputs (sha256/registry-url/ext-id/version) will be empty. The gtdx '$FORMAT' output format may have changed."
        fi

    # Read the signature back out of the artifact that was actually produced,
    # rather than trusting that passing --sign did what it says. A publish that
    # emits an unsigned describe.json is not a broken build here — it is an
    # extension every host refuses months later, so this is the step that has to
    # be certain.
    - name: Verify the produced artifact is signed
      if: steps.signing.outputs.sign == 'true'
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        EXPECTED_PUBLIC_KEY: ${{ inputs.expected-public-key }}
      run: |
        set -euo pipefail

        # A real publish copies the pack into gtdx's --dist default (./dist,
        # relative to the workspace). A dry run never reaches that copy, so fall
        # back to the staging pack gtdx leaves beside the project — same bytes.
        pack=""
        for f in dist/*.gtxpack; do
          [ -e "$f" ] || continue
          if [ "$(basename "$f")" != "publish-staging.gtxpack" ]; then
            if [ -z "$pack" ] || [ "$f" -nt "$pack" ]; then
              pack="$f"
            fi
          fi
        done
        if [ -z "$pack" ]; then
          staged="$(dirname "$MANIFEST")/dist/publish-staging.gtxpack"
          if [ -e "$staged" ]; then
            pack="$staged"
          fi
        fi
        if [ -z "$pack" ]; then
          echo "::error::signing was requested but no .gtxpack could be found to verify. Looked in ./dist and next to $MANIFEST."
          exit 1
        fi
        echo "==> verifying $pack"

        describe="${RUNNER_TEMP}/verify-describe.json"
        unzip -p "$pack" describe.json > "$describe"

        algorithm=$(jq -r '.signature.algorithm // empty' "$describe")
        public_key=$(jq -r '.signature.publicKey // empty' "$describe")
        value=$(jq -r '.signature.value // empty' "$describe")

        if [ -z "$public_key" ] || [ -z "$value" ]; then
          echo "::error::$pack has no signature in its describe.json — greentic-ext-runtime would refuse it with 'missing signature field'. gtdx ran with --sign but produced an unsigned pack."
          exit 1
        fi

        if [ -n "$EXPECTED_PUBLIC_KEY" ] && [ "$public_key" != "$EXPECTED_PUBLIC_KEY" ]; then
          # The runtime pins a publisher key per extension id on first load
          # (TOFU), so signing a later version under a different key is refused
          # as a publisher mismatch just as hard as shipping it unsigned.
          echo "::error::$pack is signed by $public_key but expected-public-key is $EXPECTED_PUBLIC_KEY. Publishing under a different publisher key than the one already pinned for this extension id makes the artifact unloadable."
          exit 1
        fi

        echo "✓ signed: algorithm=${algorithm:-<unset>} publicKey=${public_key}"
