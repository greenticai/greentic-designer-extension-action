name: 'Greentic Designer Extension Publish'
description: 'Build + publish a Greentic Designer Extension (.gtxpack) via the gtdx CLI'
author: 'greenticai'
branding:
  icon: 'package'
  color: 'green'

inputs:
  registry:
    description: |
      Target registry URI. Usually not needed when `store-url` is set.
      Accepts:
        * oci://<host>/<namespace>[/<artifact-name>]  (GHCR, Docker Hub, ACR, Harbor)
        * file://<absolute-path>                       (local filesystem)
        * local                                        (= $GREENTIC_HOME/registries/local)
        * <name>                                       (named entry from ~/.greentic/config.toml)
      When `store-url` + `store-token` are supplied and `registry` is empty,
      the action defaults to `greentic-store` (auto-wired to store-url).
    required: false
    default: ''

  store-url:
    description: |
      Shorthand for Greentic Store HTTP push. When set, the action writes
      ~/.greentic/config.toml with a registry entry named "greentic-store"
      pointing at this URL, and auto-selects it unless `registry` overrides.
      Example: http://62.171.174.152:3030
    required: false
    default: ''

  store-token:
    description: |
      Bearer token for the Store server in `store-url`. Accepts either:
        * a long-lived API token (format `gts_...`) — preferred for CI
        * a short-lived JWT from `/api/v1/auth/login` (expires after 24h)
      When set, the action writes ~/.greentic/credentials.toml mode 0600.
      Pair with `store-url`.
    required: false
    default: ''

  manifest:
    description: 'Path to the project Cargo.toml. Default: ./Cargo.toml'
    required: false
    default: './Cargo.toml'

  version:
    description: 'Override describe.json version — useful for CI tag bumps (e.g. v1.2.3 → 1.2.3).'
    required: false
    default: ''

  force:
    description: 'Overwrite an existing version in the target registry.'
    required: false
    default: 'false'

  dry-run:
    description: 'Validate + build + pack, skip the registry write. Useful for PR checks.'
    required: false
    default: 'false'

  oci-token:
    description: |
      Bearer/PAT for oci:// registries. When unset the action falls back in
      order to: GHCR_TOKEN env, GITHUB_TOKEN env (auto-injected in GHA), OCI_TOKEN
      env, then anonymous. Grant the job `permissions: packages: write` when
      pushing to ghcr.io.
    required: false
    default: ''

  format:
    description: '"human" (default) or "json" output'
    required: false
    default: 'human'

  gtdx-version:
    description: |
      Version constraint for `greentic-extension-sdk-cli` on crates.io
      (e.g. "1.2" or "=1.2.3"). Defaults to the latest published release.
      The installed binary is `gtdx`.
    required: false
    default: ''

  rust-toolchain:
    description: 'Rust toolchain version. Must support edition 2024 (>= 1.95).'
    required: false
    default: '1.95'

  cargo-component-version:
    description: 'cargo-component version to install. Default: latest compatible.'
    required: false
    default: ''

outputs:
  sha256:
    description: 'SHA-256 of the published .gtxpack (from the JSON receipt).'
    value: ${{ steps.publish.outputs.sha256 }}
  registry-url:
    description: 'URL of the published artifact (file://, http(s)://, or OCI manifest URL).'
    value: ${{ steps.publish.outputs.registry-url }}
  ext-id:
    description: 'Extension id that was published.'
    value: ${{ steps.publish.outputs.ext-id }}
  version:
    description: 'Published version.'
    value: ${{ steps.publish.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Rust toolchain
      # Pinned to a commit SHA for supply-chain safety. dtolnay/rust-toolchain
      # uses branch refs (master/stable/<version>) rather than version tags, so
      # this is master @ 2026-03-27. Dependabot keeps the pin moving.
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        targets: wasm32-wasip2

    - name: Resolve install versions
      id: versions
      shell: bash
      env:
        IN_GTDX: ${{ inputs.gtdx-version }}
        IN_CC: ${{ inputs.cargo-component-version }}
      run: |
        set -euo pipefail
        # When a version input is empty we install "latest". A constant cache
        # key would then freeze whatever was latest on the first run and never
        # pick up newer releases until the 7-day cache eviction. Resolve the
        # real latest from crates.io so the key moves when upstream publishes —
        # keeping the documented "latest" promise honest.
        # Anchored match prints only the crate's version line (the trailing
        # "...use --limit..." note has no `= "..."`), so no `head`/SIGPIPE dance.
        latest() {
          cargo search "$1" --limit 1 | sed -nE 's/^[^ ]+ = "([^"]+)".*/\1/p'
        }
        if [ -n "$IN_GTDX" ]; then
          echo "gtdx-key=pin-${IN_GTDX}" >> "$GITHUB_OUTPUT"
        else
          echo "gtdx-key=latest-$(latest greentic-extension-sdk-cli)" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$IN_CC" ]; then
          echo "cc-key=pin-${IN_CC}" >> "$GITHUB_OUTPUT"
        else
          echo "cc-key=latest-$(latest cargo-component)" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache cargo-installed binaries
      id: cache-cargo-bin
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin
        key: gtdx-cargo-bin-${{ runner.os }}-rust${{ inputs.rust-toolchain }}-${{ steps.versions.outputs.gtdx-key }}-${{ steps.versions.outputs.cc-key }}-v3

    - name: Install cargo-component
      if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        # Run installs in a directory free of rust-toolchain.toml — the
        # consumer repo may pin an older Rust (e.g. provider-extensions
        # pins 1.94.0 for its WASM components), but the host-side toolchain
        # we install gtdx + cargo-component with needs to match the action's
        # rust-toolchain input (default 1.95) which is what's compatible
        # with the SDK crates' rust-version field.
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        # Pass inputs via env (not `${{ }}` spliced into the script) so a value
        # carrying shell metacharacters can't break out of the command.
        CC_VERSION: ${{ inputs.cargo-component-version }}
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        if [ -n "$CC_VERSION" ]; then
          cargo install --locked --version "$CC_VERSION" cargo-component
        else
          cargo install --locked cargo-component
        fi

    - name: Install gtdx from crates.io
      if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        GTDX_VERSION: ${{ inputs.gtdx-version }}
        # See comment in `Install cargo-component` step.
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        # `cargo install --version` rejects bare partial versions like "0.4"
        # ("unexpected end of input while parsing minor version number"). It
        # accepts SemVer range syntax (^0.4, >=0.4, =0.4.2). Auto-prefix `^`
        # for bare partials so callers can write `gtdx-version: "0.4"` and
        # get the latest 0.4.x as expected.
        if [ -n "$GTDX_VERSION" ]; then
          arg="$GTDX_VERSION"
          case "$arg" in
            \^*|=*|\>*|\<*|~*) ;;  # already has a range qualifier
            *) arg="^${arg}" ;;
          esac
          echo "==> cargo install --locked --version '$arg' greentic-extension-sdk-cli"
          cargo install --locked --version "$arg" greentic-extension-sdk-cli
        else
          cargo install --locked greentic-extension-sdk-cli
        fi

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        gtdx --version
        cargo component --version

    - name: Wire Greentic Store config (if store-url supplied)
      if: inputs.store-url != ''
      shell: bash
      env:
        STORE_URL: ${{ inputs.store-url }}
        STORE_TOKEN: ${{ inputs.store-token }}
      run: |
        set -euo pipefail
        # A bearer token over plaintext http:// traverses the network
        # unencrypted and is interceptable. Warn loudly; prefer https://.
        case "$STORE_URL" in
          http://*)
            if [ -n "$STORE_TOKEN" ]; then
              echo "::warning::store-url uses plaintext http://; the store-token will be sent unencrypted. Use https:// for the Store server."
            fi
            ;;
        esac
        mkdir -p "$HOME/.greentic"
        cat > "$HOME/.greentic/config.toml" <<EOF
        [default]
        registry = "greentic-store"
        trust-policy = "normal"

        [[registries]]
        name = "greentic-store"
        url = "$STORE_URL"
        EOF
        if [ -n "$STORE_TOKEN" ]; then
          umask 077
          cat > "$HOME/.greentic/credentials.toml" <<EOF
        [tokens]
        greentic-store = "$STORE_TOKEN"
        EOF
          chmod 0600 "$HOME/.greentic/credentials.toml"
        else
          echo "::warning::store-url was provided without store-token. Publish will 401 unless the server accepts anonymous writes."
        fi

    - name: Resolve registry input
      id: resolve-registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        STORE_URL: ${{ inputs.store-url }}
      run: |
        set -euo pipefail
        if [ -z "$REGISTRY" ] && [ -n "$STORE_URL" ]; then
          echo "registry=greentic-store" >> "$GITHUB_OUTPUT"
        elif [ -z "$REGISTRY" ]; then
          echo "::error::Either 'registry' or 'store-url' must be set."
          exit 1
        else
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish
      id: publish
      shell: bash
      env:
        # All caller-controlled inputs are passed via env (not `${{ }}` spliced
        # into the script) so a value carrying shell metacharacters — e.g. a
        # crafted git ref reaching `version` — cannot break out of the command.
        REGISTRY: ${{ steps.resolve-registry.outputs.registry }}
        MANIFEST: ${{ inputs.manifest }}
        FORMAT: ${{ inputs.format }}
        VERSION: ${{ inputs.version }}
        FORCE: ${{ inputs.force }}
        DRY_RUN: ${{ inputs.dry-run }}
        OCI_TOKEN_IN: ${{ inputs.oci-token }}
        # gtdx's oci-token lookup chain is:
        #   --oci-token (explicit) -> GHCR_TOKEN -> GITHUB_TOKEN -> OCI_TOKEN -> anonymous.
        # We wire GITHUB_TOKEN automatically so in GitHub Actions `permissions:
        # packages: write` alone is enough. When the caller passes oci-token we
        # *also* forward it as the explicit --oci-token flag below; the flag
        # wins, this env is just the fallback link in the chain.
        GITHUB_TOKEN: ${{ inputs.oci-token != '' && inputs.oci-token || github.token }}
      run: |
        set -euo pipefail

        # Normalize a leading `v` so callers can forward a git tag ref
        # (e.g. a `v1.2.3` tag) straight into `version` and publish `1.2.3`.
        # Only strips `v` when followed by a digit.
        if [[ "$VERSION" =~ ^v[0-9] ]]; then
          VERSION="${VERSION#v}"
        fi

        args=(publish
          --registry "$REGISTRY"
          --manifest "$MANIFEST"
          --format   "$FORMAT"
        )
        if [ -n "$VERSION" ]; then
          args+=(--version "$VERSION")
        fi
        if [ "$FORCE" = "true" ]; then
          args+=(--force)
        fi
        if [ "$DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        if [ -n "$OCI_TOKEN_IN" ]; then
          args+=(--oci-token "$OCI_TOKEN_IN")
        fi

        # Run gtdx publish and capture its output for parseable receipt access.
        # When --format json is set, stdout is a single JSON object; otherwise
        # we fall back to reading the receipt file that gtdx writes to ./dist/.
        gtdx "${args[@]}" | tee gtdx-publish.stdout

        # Prefer stdout JSON when --format json was used.
        if [ "$FORMAT" = "json" ]; then
          RECEIPT=$(grep -m1 '^{' gtdx-publish.stdout || true)
        fi
        # Otherwise pick the most recent receipt file written by gtdx.
        if [ -z "${RECEIPT:-}" ]; then
          RECEIPT=$(find "$(dirname "$MANIFEST")/dist" -name 'publish-*.json' -print0 2>/dev/null \
                    | xargs -0 -r ls -t | head -1 | xargs -r cat)
        fi

        sha=""
        if [ -n "${RECEIPT:-}" ]; then
          sha=$(echo "$RECEIPT" | jq -r '.sha256 // empty')
          url=$(echo "$RECEIPT" | jq -r '.registry // .registry_url // empty')
          ext_id=$(echo "$RECEIPT" | jq -r '.ext_id // empty')
          ver=$(echo "$RECEIPT" | jq -r '.version // empty')
          {
            echo "sha256=$sha"
            echo "registry-url=$url"
            echo "ext-id=$ext_id"
            echo "version=$ver"
          } >> "$GITHUB_OUTPUT"
        fi

        # Don't silently emit empty outputs: gtdx exited 0 (pipefail would have
        # failed the step otherwise), so a missing receipt means the parse — not
        # the publish — failed. Surface it for any real (non-dry-run) publish.
        if [ -z "$sha" ] && [ "$DRY_RUN" != "true" ]; then
          echo "::warning::gtdx publish succeeded but no receipt was parsed; outputs (sha256/registry-url/ext-id/version) will be empty. Check the gtdx output format and ./dist/publish-*.json."
        fi
